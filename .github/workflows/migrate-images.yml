name: Move site images into the repo
on:
  workflow_dispatch:
  push:
    branches: [img-migrate]
    paths: ['.github/workflows/migrate-images.yml', 'tools/migrate_images.py']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python -u tools/migrate_images.py
        timeout-minutes: 30
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A img *.html *.js
          git commit -m "Host site images in the repo (img/ext) instead of imgbb/postimg" || echo "nothing to commit"
          git push
