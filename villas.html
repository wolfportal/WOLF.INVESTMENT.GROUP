floors:'fa-solid fa-layer-group',
bedRoom:'fa-solid fa-bed',
bedMaster:'fa-solid fa-bed',
pool:'fa-solid fa-water',
key:'fa-solid fa-key',
cash:'fa-solid fa-sack-dollar',
installment:'fa-solid fa-calendar-days',
tag:'fa-solid fa-tag',
wa:'fa-brands fa-whatsapp'
};
function fa(key){return `<i class="${faIcon[key]}"></i>`}
function specIcon(key){return `<span class="spec-icon">${fa(key)}</span>`}
function card(p,i){
const t=T[lang],type=t[p.type==='resort'?'resortType':p.type],name=t[p.name],desc=p.desc[lang]||p.desc.ar;
let media=p.images.map((x,j)=>`<div class="slide"><img src="${x}" alt="${p.id} ${j+1}" loading="lazy"></div>`).join('');
media+=p.vid?`<div class="slide"><video src="${p.vid}" controls playsinline preload="metadata"${p.images[0]?` poster="${p.images[0]}"`:''}></video></div>`:'';
const specs=[['land',t.land,p.land,'land'],['build',t.build,p.build,'build']];
if(p.floors)specs.push(['floors',t.floors,p.floors,'floors']);
if(p.rooms)specs.push(['rooms',t.rooms,p.rooms+(p.id==='Sal-I35'?' (2 '+(lang==='ar'?'لكل شاليه':lang==='en'?'per chalet':lang==='he'?'לכל בקתה':'თითოეულ შალეზე')+')':''),'bedRoom']);
if(p.master)specs.push(['master',t.master,p.master,'bedMaster']);
specs.push(['pool',t.pool,p.pool,'pool'],['delivery',t.delivery+':',t.instant,'key']);
const discountLine=p.discount?`<div class="discount-line">${fa('tag')}<span>${p.discount[lang]||p.discount.ar}</span></div>`:'';
let paymentBlock;
if(p.pay==='sold'){
  paymentBlock=`<span class="payment-tag sold">${t.sold}</span>`;
}else if(p.pay==='cash'){
  paymentBlock=`<span class="payment-tag cash">${fa('cash')}${t.cash}</span>`;
}else{
  const info=p.paymentInfo?(p.paymentInfo[lang]||p.paymentInfo.ar):'';
  paymentBlock=`<span class="payment-tag installment">${fa('installment')}${t.installment}</span>${info?`<span class="payment-info">${info}</span>`:''}`;
}
return `<article class="property-card${p.pay==='sold'?' is-sold':''}" data-idx="${i}"><div class="property-image ${media?'has-slides':''}" data-slider><div class="slides">${media||'<div class="slide"></div>'}</div><button class="slider-btn prev" onclick="moveSlide(this,-1)">‹</button><button class="slider-btn next" onclick="moveSlide(this,1)">›</button><div class="slider-dots"></div><span class="badge">${p.id}</span><span class="type-badge">${type}</span>${p.vid?`<span class="video-badge">${t.video}</span>`:''}</div><div class="property-details"><h2 class="property-title">${name} <span>#${p.id}</span></h2><div class="location">${fa('loc')}${t.location}</div><div class="property-specs">${specs.map(s=>`<div class="spec-item">${specIcon(s[3])}<span>${s[1]}: <strong>${s[2]}</strong></span></div>`).join('')}</div>${discountLine}<div class="divider"></div><div class="property-payment">${paymentBlock}</div><div class="property-desc" id="desc-${i}">${desc}</div><div class="property-actions"><a href="${wa}${encodeURIComponent((lang==='ar'?'مرحبا، أريد الاستفسار عن ':lang==='en'?'Hello, I would like information about ':lang==='he'?'שלום, ברצוני לברר לגבי ':'გამარჯობა, მსურს ინფორმაციის მიღება ')+name+' '+p.id)}" target="_blank" class="btn btn-whatsapp">${fa('wa')}${t.wa}</a><button class="btn btn-details" onclick="toggleDesc(${i},this)">${t.more}</button></div></div></article>`}
function render(){
const t=T[lang];
document.documentElement.lang=lang;
document.documentElement.dir=t.dir;
document.documentElement.style.setProperty('--sold',`"${t.sold}"`);
document.querySelectorAll('[data-k]').forEach(el=>{if(t[el.dataset.k]!==undefined)el.textContent=t[el.dataset.k]});
document.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('active',b.dataset.l===lang));
document.getElementById('catalog').innerHTML=data.map(card).join('');
document.querySelectorAll('[data-slider]').forEach(initSlider);
initReveal();
}
function setLang(l){lang=l;localStorage.setItem('wolf-lang',l);render()}
function toggleDesc(i,b){const d=document.getElementById('desc-'+i),t=T[lang];d.classList.toggle('show');b.textContent=d.classList.contains('show')?t.hide:t.more}
function moveSlide(btn,dir){const c=btn.closest('[data-slider]'),s=c.querySelector('.slides'),n=s.children.length;if(n<=1)return;let cur=+(c.dataset.current||0);cur=(cur+dir+n)%n;s.style.transform=`translateX(${cur*100}%)`;c.dataset.current=cur;c.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));s.querySelectorAll('video').forEach(v=>v.pause())}
function initSlider(c){const n=c.querySelector('.slides').children.length;if(n<=1)return;const dots=c.querySelector('.slider-dots');dots.innerHTML='';for(let i=0;i<n;i++){const d=document.createElement('span');d.className='dot'+(!i?' active':'');d.onclick=()=>{const s=c.querySelector('.slides');s.style.transform=`translateX(${i*100}%)`;c.dataset.current=i;c.querySelectorAll('.dot').forEach((x,j)=>x.classList.toggle('active',i===j));s.querySelectorAll('video').forEach(v=>v.pause())};dots.appendChild(d)}}
function initReveal(){
const cards=document.querySelectorAll('.property-card');
if(!('IntersectionObserver' in window)){cards.forEach(c=>c.classList.add('in-view'));return}
const io=new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.classList.add('in-view');
      io.unobserve(entry.target);
    }
  });
},{threshold:0.12,rootMargin:'0px 0px -40px 0px'});
cards.forEach(c=>io.observe(c));
}
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
setLang(lang);
</script></body></html>
